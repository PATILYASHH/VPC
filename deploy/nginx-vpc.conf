server {
    listen 80;
    server_name vpc.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vpc.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/vpc.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpc.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Proxy everything to the Node.js backend.
    # The backend serves: VPC frontend (production), API routes, and web-hosted projects.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for long operations (deploys, backups, imports)
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # File upload size limit
    client_max_body_size 50M;
}
